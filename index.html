<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>華勝科技股份有限公司 - 智慧服務報告書</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
        .canvas-box { touch-action: none; background: #fafafa; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen py-8 px-4" onload="loadDraft()">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-wider">WASON 華勝科技股份有限公司</h1>
                <p class="text-xs text-slate-400 mt-1">智慧服務報告書系統 - 內部簽核與動態填寫介面</p>
            </div>
            <div class="text-right text-xs text-slate-300 space-y-1">
                <span class="bg-amber-500 text-slate-900 px-2 py-0.5 rounded font-bold text-xs">流程狀態：待主管簽核</span>
                <div>電話: +886-3-390-6300</div>
            </div>
        </div>

        <form id="serviceForm" oninput="saveDraft()" class="p-6 md:p-8 space-y-8">
            
            <!-- 區塊一：基本資料 -->
            <div class="space-y-4">
                <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-5 bg-blue-600 rounded"></span> 一、 基本資料與客戶資訊
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">日期</label>
                        <input type="date" id="date" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">報告編號</label>
                        <input type="text" id="reportNo" value="261008" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">客戶名稱</label>
                        <input type="text" id="customerName" placeholder="例如：光陽" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">電話 / 分機</label>
                        <input type="text" id="phone" placeholder="07-382-2526 #718" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">客戶聯絡人</label>
                        <input type="text" id="contactPerson" placeholder="葉柏鈞 #718" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">報修單號</label>
                        <input type="text" id="repairNo" placeholder="E101-2026..." class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700">住址</label>
                        <input type="text" id="address" placeholder="高雄市三民區灣興街61號" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">機台編號 / 機型</label>
                        <input type="text" id="machineNo" placeholder="251947-1 G-380" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
            </div>

            <!-- 區塊二：服務性質選擇 -->
            <div class="space-y-4">
                <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-5 bg-blue-600 rounded"></span> 二、 服務性質（動態展開）
                </h2>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <label class="flex items-center space-x-2 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" name="serviceType" value="裝/試機" onchange="toggleSections()" class="rounded text-blue-600"> <span class="text-sm font-medium">裝/試機</span>
                    </label>
                    <label class="flex items-center space-x-2 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" name="serviceType" value="修護" onchange="toggleSections()" class="rounded text-blue-600"> <span class="text-sm font-medium">修護</span>
                    </label>
                    <label class="flex items-center space-x-2 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" name="serviceType" value="移機" onchange="toggleSections()" class="rounded text-blue-600"> <span class="text-sm font-medium">移機</span>
                    </label>
                    <label class="flex items-center space-x-2 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100">
                        <input type="checkbox" name="serviceType" value="教育訓練" onchange="toggleSections()" class="rounded text-blue-600"> <span class="text-sm font-medium">教育訓練</span>
                    </label>
                </div>
            </div>

            <!-- ================= 動態展開區塊 ================= -->

            <!-- 1. 裝/試機專用 -->
            <div id="installSection" class="space-y-4 p-4 bg-blue-50/50 border border-blue-200 rounded-xl hidden">
                <h3 class="text-sm font-bold text-blue-900">⚙️ 【裝機 / 試機】功能測試與比例量測</h3>
                <div class="space-y-3 text-xs">
                    <div class="space-y-1">
                        <label class="flex items-center gap-2 font-medium">
                            <input type="checkbox" id="chk_inst_func" onchange="togglePumpDesc()" class="rounded"> 設備基本功能測試（幫浦、攪拌、PID 溫控）
                        </label>
                        <input type="text" id="pumpExceptionDesc" placeholder="若測試異常，請在此填寫狀況說明..." class="w-full p-2 border rounded bg-white hidden text-xs">
                    </div>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_inst_parts" class="rounded"> 主要配件與項目齊全（壓力桶、槍架等點交完畢）</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_inst_docs" class="rounded"> 相關出廠檢驗與操作手冊文件已提供</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_inst_level" class="rounded"> 機台安裝定位與水平校正確認完畢</label>
                </div>

                <!-- 比例測試表 (即時計算偏差) -->
                <div class="overflow-x-auto pt-2">
                    <table class="w-full text-xs text-left bg-white border rounded-lg">
                        <thead class="bg-blue-100 text-slate-700">
                            <tr>
                                <th class="p-2">組別</th>
                                <th class="p-2">目標比值 (A/B)</th>
                                <th class="p-2">A量(g)</th>
                                <th class="p-2">B量(g)</th>
                                <th class="p-2">實測比值</th>
                                <th class="p-2">偏差%</th>
                                <th class="p-2">判定</th>
                            </tr>
                        </thead>
                        <tbody id="ratioContainer">
                            <tr class="ratio-row">
                                <td class="p-2"><input type="text" value="第1組" class="w-16 p-1 border rounded ratio-group"></td>
                                <td class="p-2"><input type="number" value="5" step="0.1" class="w-16 p-1 border rounded ratio-target" oninput="calcRatio(this)" title="例如 100:20 請填 5"></td>
                                <td class="p-2"><input type="number" step="0.1" class="w-16 p-1 border rounded ratio-a" oninput="calcRatio(this)" placeholder="100"></td>
                                <td class="p-2"><input type="number" step="0.1" class="w-16 p-1 border rounded ratio-b" oninput="calcRatio(this)" placeholder="20"></td>
                                <td class="p-2 ratio-actual font-mono">-</td>
                                <td class="p-2 ratio-dev font-mono">-</td>
                                <td class="p-2 ratio-judge font-bold text-slate-400">待測</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pt-2">
                    <label class="block text-xs font-medium text-slate-700 mb-1">裝機/試機完工與測試現場照片上傳：</label>
                    <input type="file" id="installPhoto" accept="image/*" capture="environment" class="text-xs">
                </div>
            </div>

            <!-- 2. 修護專用 -->
            <div id="repairSection" class="space-y-4 p-4 bg-amber-50/50 border border-amber-200 rounded-xl hidden">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-amber-900">🔧 【修護】故障原因分析與處理對策</h3>
                    <button type="button" onclick="addWorkItem()" class="text-xs bg-amber-600 text-white px-3 py-1.5 rounded">+ 新增修護項目</button>
                </div>
                <div id="workItemsContainer" class="space-y-3"></div>
            </div>

            <!-- 3. 移機專用 -->
            <div id="moveSection" class="space-y-4 p-4 bg-purple-50/50 border border-purple-200 rounded-xl hidden">
                <h3 class="text-sm font-bold text-purple-900">📦 【移機】定位與管路檢查</h3>
                <div class="space-y-2 text-xs">
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_move_power" class="rounded"> 復電後主機與控制系統正常啟動（無報錯）</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_move_leak" class="rounded"> 氣壓/液壓管路重新接合之氣密與液密性檢查（無漏氣漏液）</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_move_level" class="rounded"> 機台移機後水平校正確認</label>
                </div>
                <div class="text-xs pt-1">
                    <label class="block font-medium text-slate-700 mb-1">移機後定位與管路完工照片上傳：</label>
                    <input type="file" id="movePhoto" accept="image/*" capture="environment" class="text-xs">
                </div>
            </div>

            <!-- 4. 教育訓練專用 -->
            <div id="trainSection" class="space-y-4 p-4 bg-emerald-50/50 border border-emerald-200 rounded-xl hidden">
                <h3 class="text-sm font-bold text-emerald-900">🎓 【教育訓練】點交與簽名確認</h3>
                <div class="space-y-2 text-xs">
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_train_hmi" class="rounded"> 設備基本操作與人機介面 (HMI) 設定教學完成</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_train_maint" class="rounded"> 日常維護、膠槍拆裝與保養清潔流程教學完成</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="chk_train_docs" class="rounded"> 相關操作手冊與電路圖文件已提供給客戶</label>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">受訓人員簽名確認：</label>
                    <div class="border border-slate-300 rounded-lg overflow-hidden canvas-box bg-white">
                        <canvas id="trainCanvas" width="360" height="120" class="w-full cursor-crosshair"></canvas>
                    </div>
                    <button type="button" onclick="clearCanvas('trainCanvas')" class="mt-1 text-xs text-red-600 hover:underline">清除受訓人員簽名</button>
                </div>
            </div>

            <!-- ================= 共同欄位 ================= -->

            <!-- 區塊三：用料明細 (料號選填 + 回廠物料) -->
            <div class="space-y-4">
                <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-5 bg-blue-600 rounded"></span> 三、 用料明細與回廠物件紀錄
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">服務費用</label>
                        <select id="serviceFee" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                            <option value="無(保固期間)">無 (保固期間)</option>
                            <option value="有">有</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">設備變更</label>
                        <select id="equipChange" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                            <option value="否">否</option>
                            <option value="是">是 (需開立工程變更單)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">是否有回廠物料</label>
                        <select id="returnItem" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                            <option value="否">否</option>
                            <option value="是">是 (須於下方或備註註明)</option>
                        </select>
                    </div>
                </div>

                <!-- 更換零配件表格 (料號選填) -->
                <div class="pt-2">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-medium text-slate-700">更換零配件紀錄 (料號可先不填，後續候補)</label>
                        <button type="button" onclick="addMaterialRow()" class="text-xs bg-slate-700 text-white px-2.5 py-1 rounded">+ 新增零件</button>
                    </div>
                    <div id="materialContainer" class="space-y-2"></div>
                </div>
            </div>

            <!-- 區塊四：工時紀錄 -->
            <div class="space-y-4">
                <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-5 bg-blue-600 rounded"></span> 四、 現場工時與時數紀錄
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700">出發時間</label>
                        <input type="datetime-local" id="departTime" class="w-full mt-1 p-2 bg-slate-50 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">入廠時間</label>
                        <input type="datetime-local" id="inTime" class="w-full mt-1 p-2 bg-slate-50 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">出廠時間</label>
                        <input type="datetime-local" id="outTime" class="w-full mt-1 p-2 bg-slate-50 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">返回時間</label>
                        <input type="datetime-local" id="returnTime" class="w-full mt-1 p-2 bg-slate-50 border rounded text-xs">
                    </div>
                </div>
            </div>

            <!-- 區塊五：簽名確認 -->
            <div class="space-y-6 pt-2">
                <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-5 bg-blue-600 rounded"></span> 五、 確認與電子簽名
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">客戶確認簽名</label>
                        <div class="border border-slate-300 rounded-lg overflow-hidden canvas-box">
                            <canvas id="clientCanvas" width="360" height="150" class="w-full cursor-crosshair"></canvas>
                        </div>
                        <button type="button" onclick="clearCanvas('clientCanvas')" class="mt-1 text-xs text-red-600 hover:underline">清除客戶簽名</button>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">服務人員簽名</label>
                        <div class="border border-slate-300 rounded-lg overflow-hidden canvas-box">
                            <canvas id="staffCanvas" width="360" height="150" class="w-full cursor-crosshair"></canvas>
                        </div>
                        <button type="button" onclick="clearCanvas('staffCanvas')" class="mt-1 text-xs text-red-600 hover:underline">清除服務人員簽名</button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">服務人員姓名</label>
                    <input type="text" id="staffName" value="Jay Huang" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>

            <!-- 送出 -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-3.5 rounded-xl transition shadow-md">
                    確認無誤，送出報告（狀態：待主管簽核）
                </button>
            </div>

        </form>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        // ── 草稿自動暫存機制 (LocalStorage) ──
        function saveDraft() {
            const formData = {
                customerName: document.getElementById('customerName').value,
                reportNo: document.getElementById('reportNo').value,
                phone: document.getElementById('phone').value,
                contactPerson: document.getElementById('contactPerson').value,
                repairNo: document.getElementById('repairNo').value,
                address: document.getElementById('address').value,
                machineNo: document.getElementById('machineNo').value,
                staffName: document.getElementById('staffName').value
            };
            localStorage.setItem('serviceReportDraft', JSON.stringify(formData));
        }

        function loadDraft() {
            const saved = localStorage.getItem('serviceReportDraft');
            if (saved) {
                const data = JSON.parse(saved);
                if(data.customerName) document.getElementById('customerName').value = data.customerName;
                if(data.reportNo) document.getElementById('reportNo').value = data.reportNo;
                if(data.phone) document.getElementById('phone').value = data.phone;
                if(data.contactPerson) document.getElementById('contactPerson').value = data.contactPerson;
                if(data.repairNo) document.getElementById('repairNo').value = data.repairNo;
                if(data.address) document.getElementById('address').value = data.address;
                if(data.machineNo) document.getElementById('machineNo').value = data.machineNo;
            }
        }

        // 動態切換顯示區塊
        function toggleSections() {
            const types = Array.from(document.querySelectorAll('input[name="serviceType"]:checked')).map(cb => cb.value);
            document.getElementById('installSection').classList.toggle('hidden', !types.includes('裝/試機'));
            document.getElementById('repairSection').classList.toggle('hidden', !types.includes('修護'));
            document.getElementById('moveSection').classList.toggle('hidden', !types.includes('移機'));
            document.getElementById('trainSection').classList.toggle('hidden', !types.includes('教育訓練'));

            if (types.includes('修護') && document.getElementById('workItemsContainer').children.length === 0) {
                addWorkItem();
            }
        }

        function togglePumpDesc() {
            const chk = document.getElementById('chk_inst_func').checked;
            document.getElementById('pumpExceptionDesc').classList.toggle('hidden', !chk); // 可依需求調整勾選邏輯
        }

        // 比例即時計算與判定
        function calcRatio(element) {
            const row = element.closest('.ratio-row');
            const target = parseFloat(row.querySelector('.ratio-target').value) || 0;
            const a = parseFloat(row.querySelector('.ratio-a').value) || 0;
            const b = parseFloat(row.querySelector('.ratio-b').value) || 0;
            
            const actualCell = row.querySelector('.ratio-actual');
            const devCell = row.querySelector('.ratio-dev');
            const judgeCell = row.querySelector('.ratio-judge');

            if (b > 0 && target > 0) {
                const actual = a / b;
                const dev = ((actual - target) / target) * 100;
                actualCell.textContent = actual.toFixed(2);
                devCell.textContent = dev.toFixed(1) + '%';

                // 容許公差 ±2% 內為合格
                if (Math.abs(dev) <= 2.0) {
                    judgeCell.textContent = "合格";
                    judgeCell.className = "ratio-judge font-bold text-green-600";
                } else {
                    judgeCell.textContent = "異常";
                    judgeCell.className = "ratio-judge font-bold text-red-600";
                }
            } else {
                actualCell.textContent = "-";
                devCell.textContent = "-";
                judgeCell.textContent = "待測";
                judgeCell.className = "ratio-judge font-bold text-slate-400";
            }
        }

        function addWorkItem() {
            const container = document.getElementById('workItemsContainer');
            const div = document.createElement('div');
            div.className = "bg-white p-3 rounded-lg border border-amber-200 space-y-2 work-item-row";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-amber-800">修護項目</span>
                    <button type="button" onclick="this.closest('.work-item-row').remove()" class="text-red-500 text-xs">刪除</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input type="text" placeholder="故障現象（例如：真空異常）" class="phenomenon p-2 border rounded text-xs">
                    <input type="text" placeholder="原因分析與對策說明" class="cause-desc p-2 border rounded text-xs">
                </div>
            `;
            container.appendChild(div);
        }

        function addMaterialRow() {
            const container = document.getElementById('materialContainer');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center material-row";
            div.innerHTML = `
                <input type="text" placeholder="料號 (選填/待補)" class="mat-no p-2 border rounded text-xs w-32">
                <input type="text" placeholder="品名 (例如：油封)" class="mat-name p-2 border rounded text-xs flex-1">
                <input type="number" placeholder="數量" value="1" class="mat-qty p-2 border rounded text-xs w-16">
                <button type="button" onclick="this.closest('.material-row').remove()" class="text-red-500 text-xs px-2">刪除</button>
            `;
            container.appendChild(div);
        }

        function setupCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let painting = false;
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
            }
            canvas.addEventListener('mousedown', (e) => { painting = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
            canvas.addEventListener('mouseup', () => { painting = false; });
            canvas.addEventListener('mousemove', (e) => { if (!painting) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); painting = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); painting = false; });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!painting) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
            ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
        }
        setupCanvas('clientCanvas');
        setupCanvas('staffCanvas');
        setupCanvas('trainCanvas');

        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        }

        // 表單送出
        document.getElementById('serviceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "資料傳輸中（狀態：待主管簽核）...";

            const serviceTypes = Array.from(document.querySelectorAll('input[name="serviceType"]:checked')).map(cb => cb.value);

            const materialItems = [];
            document.querySelectorAll('.material-row').forEach(row => {
                materialItems.push({
                    partNo: row.querySelector('.mat-no').value || "待補",
                    partName: row.querySelector('.mat-name').value,
                    qty: row.querySelector('.mat-qty').value
                });
            });

            const ratioTests = [];
            document.querySelectorAll('.ratio-row').forEach(row => {
                ratioTests.push({
                    groupName: row.querySelector('.ratio-group').value,
                    targetRatio: row.querySelector('.ratio-target').value,
                    qtyA: row.querySelector('.ratio-a').value,
                    qtyB: row.querySelector('.ratio-b').value,
                    actualRatio: row.querySelector('.ratio-actual').textContent,
                    deviation: row.querySelector('.ratio-dev').textContent,
                    judge: row.querySelector('.ratio-judge').textContent
                });
            });

            const payload = {
                reportNo: document.getElementById('reportNo').value,
                date: document.getElementById('date').value,
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                contactPerson: document.getElementById('contactPerson').value,
                address: document.getElementById('address').value,
                repairNo: document.getElementById('repairNo').value,
                machineNo: document.getElementById('machineNo').value,
                serviceType: serviceTypes,
                serviceFee: document.getElementById('serviceFee').value,
                equipChange: document.getElementById('equipChange').value,
                returnItem: document.getElementById('returnItem').value,
                materialItems: materialItems,
                ratioTests: ratioTests,
                workHours: {
                    departTime: document.getElementById('departTime').value,
                    inTime: document.getElementById('inTime').value,
                    outTime: document.getElementById('outTime').value,
                    returnTime: document.getElementById('returnTime').value
                },
                staffName: document.getElementById('staffName').value,
                clientSignature: document.getElementById('clientCanvas').toDataURL(),
                staffSignature: document.getElementById('staffCanvas').toDataURL()
            };

            const GAS_URL = "https://script.google.com/macros/s/AKfycby8Rf88_OdCf4vkZN251bvUDZOtqt9a62ZgrCkUjWfV0-BNs_57-Td4AW5BpIg6M0DLGQ/exec"; // 請替換為您的 GAS 網址

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('報告已成功送出！目前狀態為「待主管簽核」，資料已同步至 Google 試算表。');
                localStorage.removeItem('serviceReportDraft'); // 結案清除草稿
                document.getElementById('serviceForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                clearCanvas('clientCanvas');
                clearCanvas('staffCanvas');
                clearCanvas('trainCanvas');
                toggleSections();
            } catch (err) {
                alert('送出失敗：' + err);
            } finally {
                btn.disabled = false;
                btn.textContent = "確認無誤，送出報告（狀態：待主管簽核）";
            }
        });
    </script>
</body>
</html>
